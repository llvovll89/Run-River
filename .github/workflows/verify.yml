name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_PUBLIC_KAKAO_MAP_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Select Xcode 26
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - run: npm ci
      - run: npm run ios:sync
      - name: Generate native project and test targets
        run: |
          command -v xcodegen || brew install xcodegen
          cd ios/App && xcodegen generate
      - name: Boot iPhone Simulator
        timeout-minutes: 8
        run: |
          DEVICE=$(xcrun simctl list devices available -j | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const d=Object.values(JSON.parse(s).devices).flat().find(d=>d.name.startsWith("iPhone"));if(!d)process.exit(1);process.stdout.write(d.udid)})')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl location "$DEVICE" set 37.66,126.98
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
      - name: Build iPhone app and test bundles
        timeout-minutes: 12
        run: |
          xcodebuild build-for-testing -project ios/App/App.xcodeproj -scheme App -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath ios/DerivedData CODE_SIGNING_ALLOWED=NO
          xcrun simctl install "$DEVICE" ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl privacy "$DEVICE" grant location com.runriver.app
      - name: Test real WKWebView, Core Location, storage and UI
        timeout-minutes: 10
        run: |
          xcodebuild test-without-building -project ios/App/App.xcodeproj -scheme App -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -derivedDataPath ios/DerivedData -resultBundlePath output/ios/Hiking.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Capture Simulator screen
        if: always() && env.DEVICE != ''
        run: |
          mkdir -p output/ios
          xcrun simctl io "$DEVICE" screenshot output/ios/iphone.png
      - run: npx playwright install webkit
      - name: Safari engine offline maps, KMZ and native bridge flows
        env:
          TEST_BROWSER: webkit
          TEST_NATIVE_PLATFORM: ios
        run: node --test tests/maps-browser.test.mjs tests/mobile-browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-verification
          path: |
            output/ios/
            output/playwright/
            ios/App/App.xcodeproj/
          retention-days: 7
  hiking-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-test-only
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-test-only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - run: psql -f tests/hiking-schema.sql
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_KAKAO_MAP_KEY: ci-placeholder
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-browser-screenshots
          path: output/playwright/
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_PUBLIC_KAKAO_MAP_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npm run android:sync
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/mobile-browser.test.mjs
      - run: node --test tests/maps-browser.test.mjs
      - run: bash ./gradlew testDebugUnitTest assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: android-compile-check
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
